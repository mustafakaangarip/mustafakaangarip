<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bize Ulaşın | Erkek Klasik Giyim</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo"> Atak Men's </div>
            <ul class="nav-links">
                <li><a href="../index.html">Ana Sayfa</a></li>
                <li><a href="urunler.html">Ürünler</a></li>
                <li><a href="sepet.html">Sepet</a></li>
                <li><a href="iletisim.html">İletişim</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-container">
        <h1 class="page-title">Bize Ulaşın</h1>
        
        <div class="contact-content">
            <div class="contact-info">
                <h3>Mağaza Bilgileri</h3>
                <p><strong>Adres:</strong> Üniversite Kampüsü, Merkez/Düzce</p>
                <p><strong>Telefon:</strong> 0850 123 45 67</p>
                <p><strong>E-posta:</strong> info@atakmens.com</p>
                <p><strong>Çalışma Saatleri:</strong> Hafta içi 09:00 - 18:00</p>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Adınız Soyadınız:</label>
                    <input type="text" id="name" placeholder="Adınızı giriniz" required>
                </div>
                
                <div class="form-group">
                    <label for="email">E-posta Adresiniz:</label>
                    <input type="email" id="email" placeholder="ornek@mail.com" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Mesajınız:</label>
                    <textarea id="message" rows="5" placeholder="Bize iletmek istediğiniz mesaj..." required></textarea>
                </div>
                
                <button type="submit" class="btn">Gönder</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Atak Men's. Tüm hakları saklıdır.</p>
    </footer>

    <script src="../scripts/myscript.js"></script>
</body>
</html>
